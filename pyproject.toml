[project]
name = "martianbook"
version = "0.3.0"
description = "Transform ordinary codebases into explainable execution artifacts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Andrew Garcia" }
]
dependencies = [
  "click>=8.0",
  "pygments>=2.20.0",
]

[project.urls]
Homepage = "https://github.com/andrewrgarcia/martianbook"
Repository = "https://github.com/andrewrgarcia/martianbook"

[project.scripts]
martian = "martianbook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/martianbook"]
include = ["src/martianbook/renderer/assets/*"]