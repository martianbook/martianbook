[project]
name = "martianbook"
version = "0.1.0"
description = "Transform ordinary codebases into explainable execution artifacts."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "Andrew Garcia" }
]
dependencies = []

[project.scripts]
martian = "martianbook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/martianbook"]